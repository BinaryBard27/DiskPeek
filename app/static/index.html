<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DiskPeek — Live Disk Usage</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">&#x25E7;</span>
      <span class="brand-name">DiskPeek</span>
      <span id="live-badge" class="live-badge">
        <span class="live-dot" aria-hidden="true"></span> LIVE
      </span>
    </div>
    <div class="topbar-right">
      <button id="theme-toggle" class="btn-theme" title="Toggle Light/Dark Theme" aria-label="Toggle theme">
        <svg id="theme-icon-sun" class="hidden" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg id="theme-icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <span id="updated" class="updated">—</span>
    </div>
  </header>

  <main>
    <section id="disks" class="disks" aria-live="polite" aria-label="Live disk usage">
      <!-- Disk cards are rendered by app.js -->
    </section>
    <p id="data-note" class="data-note"></p>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
